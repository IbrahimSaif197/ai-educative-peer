# Render's free plan stops the service after ~15 minutes idle and takes ~50s to
# wake. The extension now survives that (it retries a timeout on a 75s clock and
# says what it is waiting for), but a student still should not pay a minute for
# being first. This keeps the instance up so they rarely do.
#
# WHY THIS IS A LONG-RUNNING LOOP RATHER THAN A FREQUENT CRON
#
# The obvious `cron: */10` does not work. GitHub's scheduler is best-effort and
# under load it simply skips: on 2026-08-10 a */10 schedule produced gaps of 55,
# 61, 74 and 91 minutes — every one of them far past Render's 15-minute idle
# window, so the service was asleep for most of the day.
#
# One job that stays up and pings on its own clock does not depend on the
# scheduler at all. It runs just under GitHub's 6-hour job ceiling, then hands
# off to a fresh run. The cron below is only a safety net for when that chain
# breaks (a cancelled run, a runner failure, an outage).
#
# This is free only because the repository is public — public repos get
# unmetered Actions minutes. If it ever goes private again, delete this file:
# at one billed minute per run, minimum, a loop like this would eat the whole
# free allowance in under two days. A dedicated pinger (cron-job.org,
# UptimeRobot) is the cleaner tool and does not lean on Actions for something
# Actions is not really for.
#
# Note: GitHub disables scheduled workflows after 60 days with no commits to the
# repository, which would also stop the safety net.
name: Keep backend awake

on:
  schedule:
    # Safety net only — the running job normally hands off before this fires.
    # Must stay wider than RUN_FOR_SECONDS below, or it is not a safety net: at
    # */4 against a 5h35m run it fired first every time, and since the handoff
    # was broken it was quietly doing the whole job on its own.
    - cron: "17 */6 * * *"
  workflow_dispatch:

# Never kill a live pinger to start another. A new run queues instead, and takes
# over when the current one ends; GitHub keeps only the newest queued run, so
# the handoff and the safety net cannot stack into two concurrent loops.
concurrency:
  group: keep-backend-awake
  cancel-in-progress: false

permissions:
  actions: write # to hand off to the next run

jobs:
  ping:
    runs-on: ubuntu-latest
    # GitHub's hard job ceiling is 6 hours. Stop short so the handoff below
    # actually runs instead of being killed mid-step.
    timeout-minutes: 345
    env:
      HEALTH_URL: https://edupeer-backend.onrender.com/health
      INTERVAL_SECONDS: 300
      RUN_FOR_SECONDS: 20100 # 5h35m, leaving room under the 345m timeout
    steps:
      - name: Ping /health until it is time to hand off
        run: |
          set -uo pipefail
          deadline=$(( SECONDS + RUN_FOR_SECONDS ))
          ok=0
          fail=0

          while [ "$SECONDS" -lt "$deadline" ]; do
            # --max-time 90 covers a cold start; the retries cover a wake that
            # runs longer than that, or a deploy landing mid-ping.
            if body=$(curl -fsS --max-time 90 --retry 2 --retry-delay 20 \
                        --retry-all-errors "$HEALTH_URL"); then
              case "$body" in
                *'"firestore":"ok"'*)
                  ok=$(( ok + 1 ))
                  ;;
                *)
                  # A woken service that cannot reach Firestore still answers
                  # 200, so a bare curl -f would call this healthy while
                  # nothing persists.
                  fail=$(( fail + 1 ))
                  echo "::warning::Backend is up but Firestore is unavailable — check the service-account key in Render."
                  ;;
              esac
            else
              fail=$(( fail + 1 ))
              echo "::warning::Ping failed at $(date -u +%H:%M:%SZ)."
            fi
            sleep "$INTERVAL_SECONDS"
          done

          echo "::notice::Pings this run — ok: $ok, failed: $fail."
          # Only a total failure is worth a red run. Isolated misses are
          # expected around deploys and are already warnings.
          if [ "$ok" -eq 0 ]; then
            echo "::error::Every ping this run failed. The backend looks down."
            exit 1
          fi

      - name: Hand off to the next run
        # `always()` so a failed or timed-out run still starts its successor —
        # otherwise one bad window silently ends the chain until the cron fires.
        if: always()
        run: gh workflow run keep-backend-awake.yml --ref "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
          # Without this the step has always failed with "fatal: not a git
          # repository": there is no `actions/checkout` here — pinging a URL
          # does not need the code — so `gh` had nothing to infer the repo
          # from. Every run pinged happily for 5h35m and then went red on its
          # last line, one failure email per run.
          GH_REPO: ${{ github.repository }}
